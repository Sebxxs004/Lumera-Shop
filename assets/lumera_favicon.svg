<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LUMÉRA">
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffb0d0"/>
      <stop offset="0.48" stop-color="#f45b98"/>
      <stop offset="1" stop-color="#c51f62"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4fa" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff4fa" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feOffset dy="1.5" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Rounded app tile -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="#fff7fb"/>
  <rect x="3.8" y="3.8" width="56.4" height="56.4" rx="14.2" fill="none" stroke="#f7c1d7" stroke-width="1.2"/>
  <!-- Custom L monogram inspired by the glossy LUMÉRA lettering -->
  <g filter="url(#shadow)" stroke-linejoin="round">
    <path d="M19 13.5h10.5v27.8h17.8v9.2H19z" fill="url(#pink)" stroke="#a91e53" stroke-width="2.2"/>
    <path d="M21.4 16h5.2v26.2h18.2v5.5H21.4z" fill="none" stroke="#ffd7e7" stroke-opacity=".78" stroke-width="1.5"/>
    <path d="M20.8 15.8h6.4v4.2h-6.4z" fill="url(#shine)" opacity=".9"/>
    <path d="M30.2 47.3h14.6" stroke="#ffb5d1" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>
  </g>
  <!-- Small glossy accent echoing the accent over É -->
  <path d="M39.8 11.2c4.2-.7 7.2-2.4 9.8-5.2.8-.9 2.1-.3 2.1.9v3.3c0 1-.6 1.8-1.5 2.1-3.2 1.1-6.2 1.5-9.5 1.3-1.5-.1-2.1-1.9-.9-2.4z" fill="url(#pink)" stroke="#a91e53" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M41.3 10.9c3.2-.7 5.5-2 7.5-4" fill="none" stroke="#ffe5ef" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
</svg>
